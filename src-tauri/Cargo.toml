[package]
name = "paperwing"
version = "0.2.0"
description = "Manage Git repository sets, compare local checkouts, and review changes"
edition = "2021"

[lib]
name = "paperwing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "io-util", "time", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_UI_Shell", "Wdk_Storage_FileSystem"] }
