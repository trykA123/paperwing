[package]
name = "skein"
version = "0.2.0"
description = "Manage Git repository sets, compare local checkouts, and review changes"
edition = "2021"

[lib]
name = "skein_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
benchmark = []
diagnostics = ["benchmark"]
test-profile = ["benchmark"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "=2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "=2.0.21"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["process", "sync", "io-util", "time", "macros", "net"] }
sha1 = "=0.10.7"
sha2 = "=0.10.9"
reqwest = { version = "0.12", features = ["json"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
dbus-secret-service = { version = "=4.1.0", features = ["crypto-rust"] }
dbus = "=0.9.12"
libc = "=0.2.189"
rustix = { version = "=1.1.5", default-features = false, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_UI_Shell", "Wdk_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation"] }

[patch.crates-io]
dbus-secret-service = { path = "vendor/dbus-secret-service" }

[profile.dev.package.sha1]
opt-level = 3
